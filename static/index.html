<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CySyMo — Analyse de risque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13202B; --muted:#647082; --faint:#909AA8;
    --line:#E1E6EC; --line-soft:#EDF0F4; --bg:#E9EDF1; --paper:#FFFFFF;
    --teal:#0F7B68; --teal-soft:#E4F1ED; --teal-ink:#0A5648;
    --red:#D14233; --red-soft:#FBE9E6; --amber:#B9740F; --amber-soft:#F8EDDB;
    --radius:10px; --shadow:0 1px 2px rgba(19,32,43,.04), 0 6px 20px rgba(19,32,43,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}

  .topbar{display:flex;align-items:center;gap:18px;padding:14px 24px;background:var(--ink);color:#fff;}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.02em;}
  .logo b{color:#5FD3BD;}
  .principle{font-size:12px;color:#A7B6C1;}
  .principle b{color:#fff;font-weight:500;}
  .principle .sep{color:#46586a;}
  .kev-state{margin-left:auto;font-family:'IBM Plex Mono';font-size:11px;color:#9FB0BC;}

  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}
  .eyebrow{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  input,select{font-family:'Inter';font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}

  .row{display:grid;grid-template-columns:1.3fr 1.6fr 1fr 1fr auto;gap:10px;align-items:end;}
  @media(max-width:760px){.row{grid-template-columns:1fr 1fr;}}
  .btn{font-family:'Inter';font-size:13px;font-weight:500;padding:9px 16px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--teal-ink);}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn.sec:hover{border-color:#C7D0DA;}
  .btn:disabled{opacity:.5;cursor:default;}

  .assets-list{margin-top:14px;}
  .asset-chip{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#FAFBFC;}
  .asset-chip .nm{font-weight:600;font-size:13px;}
  .asset-chip .pr{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--teal-ink);}
  .asset-chip .lv{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);}
  .asset-chip .x{margin-left:auto;border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;}
  .asset-chip .x:hover{color:var(--red);}
  .empty{color:var(--faint);font-size:12.5px;text-align:center;padding:14px;}

  .analyze-bar{display:flex;align-items:center;gap:14px;margin-top:6px;}
  .analyze-bar input{max-width:280px;}

  /* résultats */
  #results{margin-top:8px;}
  .asset-result{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow);}
  .asset-result .info .nm{font-family:'Space Grotesk';font-weight:600;font-size:15px;}
  .asset-result .info .meta{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:2px;}
  .asset-result .score{margin-left:auto;text-align:right;}
  .asset-result .score .n{font-family:'Space Grotesk';font-weight:700;font-size:26px;line-height:1;}
  .asset-result .score .lab{font-size:10px;font-family:'IBM Plex Mono';color:var(--faint);text-transform:uppercase;letter-spacing:.1em;}
  .bar{height:6px;border-radius:6px;background:var(--line-soft);overflow:hidden;margin-top:8px;width:160px;}
  .bar .fill{height:100%;border-radius:6px;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{text-align:left;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;}
  td.cve{font-family:'IBM Plex Mono';font-size:12.5px;}
  td.num{font-family:'IBM Plex Mono';text-align:right;}
  .pill{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
  .pill.kev{background:var(--red-soft);color:var(--red);}
  .pill.no{color:var(--faint);}
  .riskcell{font-family:'IBM Plex Mono';font-weight:600;text-align:right;}

  .loading{text-align:center;color:var(--muted);padding:30px;font-size:13.5px;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{background:var(--red-soft);color:var(--red);border:1px solid #F0C7C0;border-radius:8px;padding:12px 14px;font-size:13px;}
  .foot{font-size:11px;color:var(--faint);margin-top:8px;}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">Cy<b>Sy</b>Mo</span>
  <span class="principle"><b>L'IA propose</b><span class="sep"> → </span><b>L'humain valide</b><span class="sep"> → </span><b>Le moteur calcule</b></span>
  <span class="kev-state" id="kevState">—</span>
</div>

<div class="wrap">

  <div class="card">
    <p class="eyebrow">Périmètre de la mission</p>
    <div class="row">
      <div><label>Nom de l'actif</label><input id="aName" placeholder="Passerelle VPN"></div>
      <div><label>Produit (logiciel)</label><input id="aProduct" placeholder="Fortinet FortiOS"></div>
      <div><label>Exposition</label>
        <select id="aExposure"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></div>
      <div><label>Criticité métier</label>
        <select id="aCriticality"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></div>
      <div><button class="btn" onclick="addAsset()">Ajouter</button></div>
    </div>
    <div class="assets-list" id="assetsList"><div class="empty">Aucun actif. Ajoute-en au moins un.</div></div>
  </div>

  <div class="card">
    <div class="analyze-bar">
      <input id="clientName" placeholder="Nom du client" value="Client">
      <button class="btn" id="goBtn" onclick="analyze()">Analyser la mission</button>
      <span class="foot">L'analyse interroge NVD, EPSS et le KEV en direct.</span>
    </div>
  </div>

  <div id="results"></div>

</div>

<script>
let assets = [];

async function loadHealth(){
  try{
    const r = await fetch('/health'); const d = await r.json();
    document.getElementById('kevState').textContent = `KEV ${d.kev_count} · v${d.kev_version}`;
  }catch(e){}
}
loadHealth();

function addAsset(){
  const name = document.getElementById('aName').value.trim();
  const product = document.getElementById('aProduct').value.trim();
  if(!name || !product){ alert("Donne au moins un nom et un produit."); return; }
  assets.push({
    name, product,
    exposure: document.getElementById('aExposure').value,
    criticality: document.getElementById('aCriticality').value,
  });
  document.getElementById('aName').value = '';
  document.getElementById('aProduct').value = '';
  renderAssets();
}

function removeAsset(i){ assets.splice(i,1); renderAssets(); }

function renderAssets(){
  const el = document.getElementById('assetsList');
  if(!assets.length){ el.innerHTML = '<div class="empty">Aucun actif. Ajoute-en au moins un.</div>'; return; }
  el.innerHTML = assets.map((a,i)=>`
    <div class="asset-chip">
      <span class="nm">${a.name}</span>
      <span class="pr">${a.product}</span>
      <span class="lv">exp:${a.exposure} · crit:${a.criticality}</span>
      <button class="x" onclick="removeAsset(${i})" title="retirer">✕</button>
    </div>`).join('');
}

function riskColor(r){ return r>0.5 ? 'var(--red)' : r>0.1 ? 'var(--amber)' : 'var(--teal)'; }

async function analyze(){
  if(!assets.length){ alert("Ajoute au moins un actif."); return; }
  const btn = document.getElementById('goBtn'); btn.disabled = true;
  const out = document.getElementById('results');
  out.innerHTML = '<div class="loading"><span class="spinner"></span>Analyse en cours — interrogation des sources…</div>';
  try{
    const resp = await fetch('/assess', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ client: document.getElementById('clientName').value || 'Client', assets })
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    render(await resp.json());
  }catch(e){
    out.innerHTML = `<div class="err">Erreur : ${e.message}. Le serveur tourne-t-il ? La clé NVD est-elle chargée ?</div>`;
  }finally{ btn.disabled = false; }
}

function render(data){
  let html = `<p class="eyebrow">Risque par actif — ${data.client}</p>`;
  for(const a of data.assets){
    const r = a.risk ?? 0;
    html += `
      <div class="asset-result">
        <div class="info">
          <div class="nm">${a.name}</div>
          <div class="meta">${a.product} · ${a.determined} CVE${a.undetermined?` · ${a.undetermined} à coter`:''}</div>
          <div class="bar"><div class="fill" style="width:${Math.round(r*100)}%;background:${riskColor(r)}"></div></div>
        </div>
        <div class="score"><div class="n" style="color:${riskColor(r)}">${r.toFixed(2)}</div><div class="lab">risque / 1</div></div>
      </div>`;
  }

  html += `<p class="eyebrow" style="margin-top:22px">Priorités — quoi corriger d'abord</p><div class="card" style="padding:6px 4px">
    <table><thead><tr><th>#</th><th>Actif</th><th>CVE</th><th>CVSS</th><th>EPSS</th><th>État</th><th style="text-align:right">Risque</th></tr></thead><tbody>`;
  data.findings.forEach((f,i)=>{
    const kev = f.in_kev ? '<span class="pill kev">exploitée</span>' : '<span class="pill no">—</span>';
    html += `<tr>
      <td class="num">${i+1}</td>
      <td>${f.asset}</td>
      <td class="cve">${f.cve_id}</td>
      <td class="num">${f.cvss ?? '—'}</td>
      <td class="num">${f.epss!=null ? f.epss.toFixed(3) : '—'}</td>
      <td>${kev}</td>
      <td class="riskcell" style="color:${riskColor(f.risk)}">${f.risk.toFixed(4)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>
    <p class="foot">Chaque chiffre vient d'une source publique (NVD · EPSS · CISA KEV). Prochaine étape : validation par le consultant.</p>`;
  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
